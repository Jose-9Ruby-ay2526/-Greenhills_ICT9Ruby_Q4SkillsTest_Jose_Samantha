<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<title>Login Page</title>

<style>

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background: #ffd6e8;
    overflow: hidden;
    font-family: Arial, sans-serif;
}


body::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: radial-gradient(white 1px, transparent 1px);
    background-size: 50px 50px;
    opacity: 0.3;
}


.login-box {
    width: 380px;
    padding: 40px;
    border-radius: 20px;

    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    box-shadow: 0 8px 32px rgba(255, 105, 180, 0.25);
    color: #d63384;
    text-align: center;
    position: relative;
    z-index: 1;
}

.login-box h2 {
    margin-bottom: 10px;
    font-weight: bold;
    color: #ff4fa3;
}


.form-control {
    background: rgba(255,255,255,0.7);
    border: none;
    color: #d63384;
}

.form-control::placeholder {
    color: #e38bb7;
}

.form-control:focus {
    box-shadow: none;
    background: rgba(255,255,255,0.9);
    color: #d63384;
}


.btn-login {
    background: #ff69b4;
    color: white;
    font-weight: bold;
    border-radius: 30px;
    padding: 10px;
}

.btn-login:hover {
    background: #ff4fa3;
    color: white;
}
</style>
</head>

<body>

<div class="login-box">
    <h2>Login</h2>
    <p class="mb-4">Enter your account details</p>

    <input type="text" id="user" class="form-control mb-3" placeholder="Username">
    <input type="password" id="pass" class="form-control mb-3" placeholder="Password">

    <button onclick="log_in()" class="btn btn-login w-100">
        Login
    </button>

    <div id="errorMsg" class="mt-3 text-danger fw-bold"></div>
</div>

<script src="mainn.js"></script>

</body>
</html>
